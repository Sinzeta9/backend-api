name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://devuser:ci_password@localhost:5432/devdb
      TEST_DATABASE_URL: postgresql+psycopg://devuser:ci_password@localhost:5432/testdb

      JWT_SECRET_KEY: ci-only-secret-key
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 30

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: devuser
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: devdb

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U devuser -d devdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear base de datos de tests
        run: |
          python - <<'PY'
          import psycopg

          connection = psycopg.connect(
              "postgresql://devuser:ci_password@localhost:5432/devdb",
              autocommit=True,
          )

          with connection.cursor() as cursor:
              cursor.execute(
                  "SELECT 1 FROM pg_database WHERE datname = 'testdb'"
              )

              if cursor.fetchone() is None:
                  cursor.execute("CREATE DATABASE testdb")

          connection.close()

          print("testdb preparada")
          PY

      - name: Ejecutar Ruff
        run: ruff check .

      - name: Ejecutar tests
        run: python -m pytest